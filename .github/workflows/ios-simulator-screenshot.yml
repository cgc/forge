name: iOS Simulator Screenshot

on:
  push:
    branches:
      - 'copilot/spec-out-forge-ios-support'
    paths:
      - 'forge-gui-ios/**'
      - 'forge-gui-mobile/**'
      - 'forge-gui/**'
      - '.github/workflows/ios-simulator-screenshot.yml'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache RoboVM compiler output
        uses: actions/cache@v4
        with:
          path: ~/.robovm/cache
          key: robovm-${{ runner.os }}-${{ hashFiles('forge-gui-ios/pom.xml', 'forge-gui-ios/robovm.xml', 'forge-gui-ios/robovm.properties') }}
          restore-keys: |
            robovm-${{ runner.os }}-

      - name: Add arm64-simulator slices to native iOS libraries
        run: |
          # The committed .a files only contain armv7 and arm64 (device) slices.
          # On Apple Silicon the simulator targets arm64-simulator, a distinct Mach-O
          # platform environment.  Without a matching slice the linker silently drops
          # the entire file, leaving IOSGLES20.init() and other JNI symbols unresolved,
          # which causes UnsatisfiedLinkError at runtime.
          #
          # Fix: extract the arm64 device slice, use vtool to re-stamp its platform
          # as iphonesimulator, then lipo it back together with the originals.
          for lib in forge-gui-ios/libs/libgdx.a \
                     forge-gui-ios/libs/libObjectAL.a \
                     forge-gui-ios/libs/libgdx-freetype.a; do
            tmpdir=$(mktemp -d)
            lipo "$lib" -thin arm64 -output "$tmpdir/arm64.a"
            (
              cd "$tmpdir"
              ar x arm64.a
              for obj in *.o; do
                vtool -set-build-version iphonesimulator 12.0 12.0 \
                      -replace -output "$obj" "$obj"
              done
              libtool -static -o arm64-sim.a *.o
            )
            lipo "$lib" "$tmpdir/arm64-sim.a" -create -output "$lib"
            rm -rf "$tmpdir"
          done

      - name: Build all modules and start iOS Simulator app in background
        run: |
          export _JAVA_OPTIONS="-Xmx4g"
          # -am builds all upstream modules first, then forge-gui-ios with the ios-simulator profile.
          # Keeping both in one Maven reactor avoids the ${revision} resolution issue that occurs
          # when running a second mvn invocation against an already-installed (flattened) parent POM.
          # iphone-sim boots the simulator, installs and launches the app, then blocks —
          # run in background so the next step can poll for the booted state.
          # Tee output to a log file so it is available even if Maven fails.
          mvn -B -e clean install -pl forge-gui-ios -am -P ios-simulator \
            -Dmaven.test.skip=true > /tmp/mvn-simulator.log 2>&1 &
          echo "MVN_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for simulator to boot and app to launch, then screenshot
        run: |
          echo "Waiting for MobiVM AOT compilation and simulator launch..."
          echo "(MobiVM compiles Java to native code on first run — this can take 30–45 min)"
          SCREENSHOT_TAKEN=false
          for i in $(seq 1 60); do
            sleep 60
            echo "Minute $i/60: checking for a booted simulator..."
            # Exit early if Maven has already finished (success or failure).
            if ! kill -0 "${MVN_PID}" 2>/dev/null; then
              echo "Maven process has exited."
              break
            fi
            BOOTED=$(xcrun simctl list devices booted 2>/dev/null | grep -c "Booted" || true)
            if [ "${BOOTED:-0}" -gt "0" ]; then
              echo "Simulator booted. Waiting for Forge app process to start..."
              # RoboVM iOS-simulator apps run as real macOS processes; poll the host
              # process table until the Forge executable appears (up to ~5 min).
              for j in $(seq 1 20); do
                sleep 15
                if pgrep -f "forge.ios.Main" > /dev/null 2>&1; then
                  echo "Forge app process is running."
                  break
                fi
                echo "  Check $j/20: process not yet visible..."
              done
              # Poll screenshots until two consecutive captures are binary-identical,
              # which indicates the loading screen has cleared and the main menu is
              # being displayed.  The first capture is taken immediately; subsequent
              # ones are spaced 20 s apart.
              echo "Polling for app loading screen to clear..."
              PREV_SHOT=""
              STABLE_COUNT=0
              for k in $(seq 1 30); do
                CUR_SHOT="/tmp/forge-poll-$k.png"
                xcrun simctl io booted screenshot "$CUR_SHOT" 2>/dev/null || { sleep 20; continue; }
                if [ -n "$PREV_SHOT" ] && cmp -s "$CUR_SHOT" "$PREV_SHOT"; then
                  STABLE_COUNT=$((STABLE_COUNT + 1))
                  echo "  Screen stable for ${STABLE_COUNT}/3 consecutive checks."
                  if [ "${STABLE_COUNT}" -ge 3 ]; then
                    echo "Loading complete — screen has stabilized."
                    cp "$CUR_SHOT" forge-screenshot.png
                    SCREENSHOT_TAKEN=true
                    break
                  fi
                else
                  STABLE_COUNT=0
                fi
                PREV_SHOT="$CUR_SHOT"
                sleep 20
              done
              # Fallback: if the screen never stabilized within the polling window
              # (e.g. the home screen has subtle animations), use the most recent
              # captured frame — by this point we are well past the loading screen.
              if [ "$SCREENSHOT_TAKEN" != "true" ] && [ -n "$PREV_SHOT" ] && [ -f "$PREV_SHOT" ]; then
                echo "Screen did not stabilize within polling window; using last available frame."
                cp "$PREV_SHOT" forge-screenshot.png
                SCREENSHOT_TAKEN=true
              fi
              break
            fi
          done
          # If Maven exited but the simulator was already booted, try to screenshot now.
          if [ "$SCREENSHOT_TAKEN" != "true" ]; then
            BOOTED=$(xcrun simctl list devices booted 2>/dev/null | grep -c "Booted" || true)
            if [ "${BOOTED:-0}" -gt "0" ]; then
              echo "Simulator is booted (Maven just exited). Taking screenshot..."
              xcrun simctl io booted screenshot forge-screenshot.png && SCREENSHOT_TAKEN=true
            fi
          fi
          if [ "$SCREENSHOT_TAKEN" != "true" ]; then
            echo "::error::Simulator did not boot. Check the mvn-simulator-log artifact for details."
            exit 1
          fi

      - name: Stop simulator and clean up
        if: always()
        run: |
          [ -n "${MVN_PID}" ] && kill "${MVN_PID}" 2>/dev/null || true
          xcrun simctl shutdown all 2>/dev/null || true

      - name: Upload Maven build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvn-simulator-log
          path: /tmp/mvn-simulator.log
          if-no-files-found: warn

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simulator-screenshot
          path: forge-screenshot.png
          if-no-files-found: error
