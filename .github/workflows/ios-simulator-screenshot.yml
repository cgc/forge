name: iOS Simulator Screenshot

on:
  push:
    branches:
      - 'copilot/**'
    paths:
      - 'forge-gui-ios/**'
      - 'forge-gui-mobile/**'
      - 'forge-gui/**'
      - '.github/workflows/ios-simulator-screenshot.yml'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache RoboVM compiler output
        uses: actions/cache@v4
        with:
          path: ~/.robovm/cache
          key: robovm-${{ runner.os }}-${{ hashFiles('forge-gui-ios/pom.xml', 'forge-gui-ios/robovm-simulator.xml', 'forge-gui-ios/robovm.properties', 'forge-gui-ios/src/com/badlogic/gdx/backends/iosrobovm/IOSGLES20.java') }}
          restore-keys: |
            robovm-${{ runner.os }}-

      - name: Build iOS app
        # Run Maven in the foreground so that compilation/AOT progress is visible
        # in the GitHub Actions log.  The ios-simulator profile uses the MobiVM
        # 'install' goal (build-only; no simulator launch), so Maven exits cleanly
        # once the .app bundle is produced.
        run: |
          set -o pipefail
          export _JAVA_OPTIONS="-Xmx4g"
          mvn -B -e clean install -pl forge-gui-ios -am -P ios-simulator \
            -Dmaven.test.skip=true 2>&1 | tee /tmp/mvn-build.log

      - name: Boot simulator and launch app
        run: |
          # The MobiVM 'install' goal places the app bundle contents flat in
          # forge-gui-ios/target/robovm/ (binary, Info.plist, res/, lib/, …).
          # xcrun simctl install requires a directory with a .app suffix, so
          # rename target/robovm to target/Forge.app (matching app.name in
          # robovm.properties).
          ROBOVM_OUT="forge-gui-ios/target/robovm"
          APP_PATH="forge-gui-ios/target/Forge.app"
          if [ ! -d "$ROBOVM_OUT" ]; then
            echo "::error::MobiVM output directory not found: $ROBOVM_OUT"
            find forge-gui-ios/target -maxdepth 2 -type d 2>/dev/null || true
            exit 1
          fi
          mv "$ROBOVM_OUT" "$APP_PATH"
          echo "App bundle: $APP_PATH"

          # Pick the newest available iPhone simulator.
          DEVICE_UDID=$(xcrun simctl list devices available --json 2>/dev/null | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          for runtime in sorted(d.keys(), reverse=True):
              if 'iOS' in runtime:
                  for dev in d[runtime]:
                      if dev['isAvailable'] and 'iPhone' in dev['name']:
                          print(dev['udid'])
                          sys.exit(0)
          sys.exit(1)
          " 2>/dev/null || true)
          if [ -z "$DEVICE_UDID" ]; then
            echo "::error::No available iPhone simulator device found"
            xcrun simctl list devices
            exit 1
          fi
          echo "Simulator device: $DEVICE_UDID"

          # Shut down any running simulators first so we start with a clean
          # display service.  Stale simulator state from a previous run can
          # cause 'xcrun simctl io screenshot' to hang indefinitely.
          xcrun simctl shutdown all 2>/dev/null || true
          sleep 2

          # Boot the device.
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

          # Open Simulator.app to initialize the display service.
          # 'xcrun simctl io screenshot' requires SimulatorKit's display
          # service (part of Simulator.app) to be running.  Without it the
          # screenshot command hangs indefinitely.  Opening Simulator.app
          # after the device boots attaches to the already-booted device
          # and starts the display service.
          open -a Simulator
          sleep 5  # allow SimulatorKit display service to initialise

          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"

          # Stream the device log before launching so we capture system-level
          # startup messages and any Java exceptions.
          xcrun simctl spawn booted log stream \
            --predicate 'processImagePath ENDSWITH "forge.ios.Main" OR process == "forge.ios.Main"' \
            >> /tmp/forge-app-log.txt 2>&1 &
          SIM_LOG_PID=$!
          # Detach from the step shell so the log stream is not killed when
          # bash exits at the end of this step (prevents SIGHUP on step exit).
          disown $SIM_LOG_PID
          sleep 1  # give the log stream time to start

          # Launch the app.  --stdout/--stderr redirect the app's file
          # descriptors 1 and 2 to files on the host; simctl exits immediately
          # after printing "forge.ios: <pid>" and the app keeps running.
          touch /tmp/forge-app-stdout.log /tmp/forge-app-stderr.log
          LAUNCH_OUT=$(xcrun simctl launch \
            --stdout=/tmp/forge-app-stdout.log \
            --stderr=/tmp/forge-app-stderr.log \
            "$DEVICE_UDID" forge.ios 2>&1)
          echo "simctl launch output: $LAUNCH_OUT"
          APP_PID=$(echo "$LAUNCH_OUT" | grep -oE 'forge\.ios: [0-9]+' \
            | grep -oE '[0-9]+$' | head -1 || true)
          echo "App PID: ${APP_PID:-not available}"

          echo "DEVICE_UDID=$DEVICE_UDID"   >> "$GITHUB_ENV"
          echo "APP_PID=$APP_PID"           >> "$GITHUB_ENV"
          echo "SIM_LOG_PID=$SIM_LOG_PID"   >> "$GITHUB_ENV"

      - name: Wait for app to load and capture screenshot
        run: |
          # Write a helper that hashes PNG image data while skipping the top 5 %
          # of rows (the iOS status bar that shows the system clock).  Comparing
          # cropped hashes rather than raw bytes prevents the minute-hand tick from
          # resetting the stability counter between polling intervals.
          cat > /tmp/png_hash.py << 'PYEOF'
          import sys, zlib, struct, hashlib
          path = sys.argv[1]
          with open(path, 'rb') as f:
              data = f.read()
          pos = 8
          width = height = color_type = bit_depth = 0
          idat = b''
          while pos < len(data):
              length = struct.unpack('>I', data[pos:pos+4])[0]
              ctype  = data[pos+4:pos+8]
              chunk  = data[pos+8:pos+8+length]
              pos   += 12 + length
              if ctype == b'IHDR':
                  width      = struct.unpack('>I', chunk[:4])[0]
                  height     = struct.unpack('>I', chunk[4:8])[0]
                  bit_depth  = chunk[8]
                  color_type = chunk[9]
              elif ctype == b'IDAT':
                  idat += chunk
              elif ctype == b'IEND':
                  break
          channels   = {0:1, 2:3, 3:1, 4:2, 6:4}.get(color_type, 4)
          row_bytes  = 1 + width * channels * max(1, bit_depth // 8)
          skip_rows  = max(50, height // 20)   # ≥50 px, or 5 % of image height (whichever is larger)
          raw        = zlib.decompress(idat)
          print(hashlib.md5(raw[skip_rows * row_bytes:]).hexdigest())
          PYEOF

          # Quick process-alive check (up to ~30 s).  The app launches
          # synchronously via simctl so it is either already running or already
          # dead.  Do NOT use 'pgrep -f forge.ios.Main' — the log stream process
          # has "forge.ios.Main" in its --predicate and would always match.
          echo "Checking Forge app process (PID ${APP_PID:-unknown})..."
          APP_ALIVE=false
          for j in $(seq 1 6); do
            if [ -n "$APP_PID" ] && kill -0 "$APP_PID" 2>/dev/null; then
              echo "  Forge app is running (PID $APP_PID)."
              APP_ALIVE=true
              break
            fi
            echo "  Check $j/6: process not found yet — sleeping 5 s..."
            sleep 5
          done
          if [ "$APP_ALIVE" = "false" ]; then
            echo "::warning::App process not found after 30 s (PID ${APP_PID:-unknown}). App may have crashed."
          fi

          # Print captured logs immediately so crash reasons are visible early.
          echo "=== App stdout (first 100 lines) ==="
          head -100 /tmp/forge-app-stdout.log 2>/dev/null || echo "(no stdout captured)"
          echo "==="
          echo "=== App stderr (first 100 lines) ==="
          head -100 /tmp/forge-app-stderr.log 2>/dev/null || echo "(no stderr captured)"
          echo "==="
          echo "=== System log stream (first 100 lines) ==="
          head -100 /tmp/forge-app-log.txt 2>/dev/null || echo "(no system log stream captured)"
          echo "==="
          echo "=== Historical system log (last 2 min, forge process) ==="
          xcrun simctl spawn booted log show \
            --predicate 'processImagePath ENDSWITH "forge.ios.Main" OR process == "forge.ios.Main"' \
            --last 2m --style syslog 2>/dev/null | head -200 || echo "(log show not available)"
          echo "==="

          echo "Polling for stable screen (status bar excluded from comparison)..."
          PREV_HASH=""
          STABLE_COUNT=0
          LAST_SHOT=""
          SCREENSHOT_TAKEN=false
          DEAD_COUNT=0

          for k in $(seq 1 40); do
            # Take screenshot with a 30-second timeout to prevent 'xcrun simctl io'
            # from hanging indefinitely if the simulator is in a bad state.
            CUR_SHOT="/tmp/forge-poll-$k.png"
            if ! timeout 30 xcrun simctl io "$DEVICE_UDID" screenshot "$CUR_SHOT" 2>/dev/null; then
              echo "  Poll $k: screenshot failed/timed out — sleeping 10 s..."
              sleep 10
              continue
            fi
            LAST_SHOT="$CUR_SHOT"

            CUR_HASH=$(python3 /tmp/png_hash.py "$CUR_SHOT" 2>/dev/null \
              || md5 -q "$CUR_SHOT")  # fall back to raw file hash if PNG parsing fails

            if [ "$CUR_HASH" = "$PREV_HASH" ] && [ -n "$PREV_HASH" ]; then
              STABLE_COUNT=$((STABLE_COUNT + 1))
              echo "  Poll $k: screen stable ${STABLE_COUNT}/3 (hash prefix: ${CUR_HASH:0:8})"
              if [ "$STABLE_COUNT" -ge 3 ]; then
                echo "Screen has stabilized — loading complete."
                cp "$CUR_SHOT" forge-screenshot.png
                SCREENSHOT_TAKEN=true
                break
              fi
            else
              STABLE_COUNT=0
              echo "  Poll $k: screen changed (hash prefix: ${CUR_HASH:0:8})"
            fi
            PREV_HASH="$CUR_HASH"

            # Check process liveness.  If it has been dead for 3 consecutive
            # polls the app has crashed — take a final screenshot and stop early
            # rather than polling uselessly for the remaining iterations.
            if [ -n "$APP_PID" ] && ! kill -0 "$APP_PID" 2>/dev/null; then
              DEAD_COUNT=$((DEAD_COUNT + 1))
              echo "  Poll $k: app process gone (dead count $DEAD_COUNT/3)"
              if [ "$DEAD_COUNT" -ge 3 ]; then
                echo "::warning::App has been dead for 3 consecutive polls — stopping early."
                break
              fi
            else
              DEAD_COUNT=0
            fi

            sleep 15
          done

          # Fallback: use the most recent frame if the screen never stabilized.
          if [ "$SCREENSHOT_TAKEN" != "true" ] && [ -n "$LAST_SHOT" ] && [ -f "$LAST_SHOT" ]; then
            echo "Screen did not stabilize within polling window; using last captured frame."
            cp "$LAST_SHOT" forge-screenshot.png
            SCREENSHOT_TAKEN=true
          fi

          if [ "$SCREENSHOT_TAKEN" != "true" ]; then
            echo "::error::No screenshot could be taken. Simulator may not have booted."
            exit 1
          fi

      - name: Stop simulator
        if: always()
        run: |
          # Stop the background log stream.
          [ -n "$SIM_LOG_PID" ]  && kill "$SIM_LOG_PID"  2>/dev/null || true

          # Use 'log show' (historical, not streaming) to capture any log
          # messages from the app's lifetime that the real-time 'log stream'
          # may have missed due to startup timing.
          xcrun simctl spawn booted log show \
            --predicate 'processImagePath ENDSWITH "forge.ios.Main" OR process == "forge.ios.Main" OR process == "ReportCrash"' \
            --last 5m --style syslog \
            >> /tmp/forge-app-log.txt 2>/dev/null || true

          xcrun simctl shutdown all 2>/dev/null || true

          # Collect crash reports.  iOS Simulator writes them to the per-device
          # CrashReporter directory, NOT to ~/Library/Logs/DiagnosticReports.
          # Search both locations to be safe.
          {
            find ~/Library/Logs/DiagnosticReports \
              -name "*forge*" -newer /tmp/mvn-build.log \
              -exec cat {} \; 2>/dev/null || true
            find ~/Library/Developer/CoreSimulator/Devices \
              -path "*/Logs/CrashReporter/*forge*" -newer /tmp/mvn-build.log \
              -exec cat {} \; 2>/dev/null || true
          } > /tmp/forge-crash-reports.txt
          CRASH_LINES=$(wc -l < /tmp/forge-crash-reports.txt 2>/dev/null || echo 0)
          echo "Crash report lines collected: $CRASH_LINES"

          # Print app stdout/stderr inline so the error is visible without
          # downloading the artifact.
          echo "=== App stdout ==="
          cat /tmp/forge-app-stdout.log 2>/dev/null || echo "(none)"
          echo "=== App stderr ==="
          cat /tmp/forge-app-stderr.log 2>/dev/null || echo "(none)"
          echo "==="

          # Collect the Forge application log written by ExceptionHandler.
          # It lives inside the app bundle's data/ subdirectory (which is writable
          # in the simulator even though it is read-only on a real device).
          # Use DEVICE_UDID to scope to the current simulator's device directory.
          FORGE_LOG=$(find ~/Library/Developer/CoreSimulator/Devices/"$DEVICE_UDID" \
            -name "forge.log" -newer /tmp/mvn-build.log 2>/dev/null | head -1 || true)
          if [ -n "$FORGE_LOG" ]; then
            cp "$FORGE_LOG" /tmp/forge-app-data.log 2>/dev/null || true
            echo "=== forge.log ($(wc -l < /tmp/forge-app-data.log) lines) ==="
            cat /tmp/forge-app-data.log
            echo "==="
          else
            echo "forge.log: not found (app may not have run or ExceptionHandler did not fire)"
          fi

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvn-build-log
          path: /tmp/mvn-build.log
          if-no-files-found: warn

      - name: Upload app and crash logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-logs
          path: |
            /tmp/forge-app-stdout.log
            /tmp/forge-app-stderr.log
            /tmp/forge-app-log.txt
            /tmp/forge-crash-reports.txt
            /tmp/forge-app-data.log
          if-no-files-found: warn

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simulator-screenshot
          path: forge-screenshot.png
          if-no-files-found: error
