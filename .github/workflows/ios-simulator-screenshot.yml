name: iOS Simulator Screenshot

on:
  push:
    branches:
      - 'copilot/**'
    paths:
      - 'forge-gui-ios/**'
      - 'forge-gui-mobile/**'
      - 'forge-gui/**'
      - '.github/workflows/ios-simulator-screenshot.yml'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache RoboVM compiler output
        uses: actions/cache@v4
        with:
          path: ~/.robovm/cache
          key: robovm-${{ runner.os }}-${{ hashFiles('forge-gui-ios/pom.xml', 'forge-gui-ios/robovm-simulator.xml', 'forge-gui-ios/robovm.properties', 'forge-gui-ios/src/com/badlogic/gdx/backends/iosrobovm/IOSGLES20.java') }}
          restore-keys: |
            robovm-${{ runner.os }}-

      - name: Build and launch iOS app in simulator
        # Run Maven in the FOREGROUND so all build output is visible live in the
        # GitHub Actions log (via tee) and APP_PID is guaranteed to be in the log
        # when the step finishes.  This eliminates the background-process race
        # conditions that previously caused APP_PID=unknown.
        #
        # Maven's iphone-sim goal:
        #   1. AOT-compiles and copies resources into the .app bundle
        #   2. Boots the simulator (opens Simulator.app via NSWorkspace)
        #   3. Installs the .app bundle
        #   4. Launches the app (prints "forge.ios: <pid>" to stdout)
        #   5. Returns — the app keeps running independently in the simulator daemon
        #
        # After Maven exits we explicitly re-open Simulator.app (idempotent if
        # already open) and sleep 5 s to ensure its SimulatorKit display consumer
        # is fully attached before the next step takes screenshots.
        run: |
          # Kill any lingering simulator sessions.  'shutdown all' can hang on a
          # stale simulator, so cap it at 30 s.
          timeout 30 xcrun simctl shutdown all 2>/dev/null || true
          sleep 2

          export _JAVA_OPTIONS="-Xmx4g"
          # Run Maven foreground; tee so output appears live in the step log AND
          # is saved to file for artifact upload and PID extraction.
          set -o pipefail
          mvn -B -e \
            -Dmaven.test.skip=true \
            -pl forge-gui-ios -am \
            -P ios-simulator-launch \
            clean pre-integration-test \
            2>&1 | tee /tmp/mvn-sim.log
          echo "Maven build complete."

          # Extract the app PID that iphone-sim printed to its log.
          APP_PID=$(grep -oE 'forge\.ios: [0-9]+' /tmp/mvn-sim.log \
            | tail -1 | grep -oE '[0-9]+$' || true)
          echo "APP_PID=${APP_PID:-unknown}" >> "$GITHUB_ENV"
          echo "App PID: ${APP_PID:-not found}"

          # Capture the UDID of the booted device for screenshot and crash-report search.
          DEVICE_UDID=$(xcrun simctl list devices --json 2>/dev/null | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          for runtime in sorted(d.keys(), reverse=True):
              if 'iOS' in runtime:
                  for dev in d[runtime]:
                      if dev.get('state') == 'Booted' and 'iPhone' in dev['name']:
                          print(dev['udid'])
                          sys.exit(0)
          sys.exit(1)
          " 2>/dev/null || true)
          echo "Booted device UDID: ${DEVICE_UDID:-unknown}"
          if [ -z "$DEVICE_UDID" ]; then
            echo "::error::Could not determine booted device UDID after Maven build."
            exit 1
          fi
          echo "DEVICE_UDID=${DEVICE_UDID}" >> "$GITHUB_ENV"

          # Ensure Simulator.app is open and its display consumer attached.
          # iphone-sim opens it via NSWorkspace during the build; re-opening is
          # idempotent (focuses the existing window) and guarantees the display
          # service is ready for 'xcrun simctl io screenshot' in the next step.
          open -a Simulator
          sleep 5

      - name: Wait for app to load and capture screenshot
        run: |
          # Write a helper that hashes PNG image data while skipping the top 5 %
          # of rows (the iOS status bar that shows the system clock).  Comparing
          # cropped hashes rather than raw bytes prevents the minute-hand tick from
          # resetting the stability counter between polling intervals.
          cat > /tmp/png_hash.py << 'PYEOF'
          import sys, zlib, struct, hashlib
          path = sys.argv[1]
          with open(path, 'rb') as f:
              data = f.read()
          pos = 8
          width = height = color_type = bit_depth = 0
          idat = b''
          while pos < len(data):
              length = struct.unpack('>I', data[pos:pos+4])[0]
              ctype  = data[pos+4:pos+8]
              chunk  = data[pos+8:pos+8+length]
              pos   += 12 + length
              if ctype == b'IHDR':
                  width      = struct.unpack('>I', chunk[:4])[0]
                  height     = struct.unpack('>I', chunk[4:8])[0]
                  bit_depth  = chunk[8]
                  color_type = chunk[9]
              elif ctype == b'IDAT':
                  idat += chunk
              elif ctype == b'IEND':
                  break
          channels   = {0:1, 2:3, 3:1, 4:2, 6:4}.get(color_type, 4)
          row_bytes  = 1 + width * channels * max(1, bit_depth // 8)
          skip_rows  = max(50, height // 20)   # ≥50 px, or 5 % of image height (whichever is larger)
          raw        = zlib.decompress(idat)
          print(hashlib.md5(raw[skip_rows * row_bytes:]).hexdigest())
          PYEOF

          # Quick process-alive check (up to ~30 s).  The app was launched
          # synchronously by Maven (iphone-sim) so it is either already running
          # or already dead.  Check via kill -0 on the host PID.
          # Guard: only run if APP_PID is a valid decimal number.
          echo "Checking Forge app process (PID ${APP_PID:-unknown})..."
          APP_ALIVE=false
          if [[ "$APP_PID" =~ ^[0-9]+$ ]]; then
            for j in $(seq 1 6); do
              if kill -0 "$APP_PID" 2>/dev/null; then
                echo "  Forge app is running (PID $APP_PID)."
                APP_ALIVE=true
                break
              fi
              echo "  Check $j/6: process not found yet — sleeping 5 s..."
              sleep 5
            done
          fi
          if [ "$APP_ALIVE" = "false" ]; then
            echo "::warning::App process not found after check (PID ${APP_PID:-unknown}). App may have crashed."
          fi

          # Print captured logs immediately so crash reasons are visible early.
          echo "=== Maven simulator log (first 100 lines) ==="
          head -100 /tmp/mvn-sim.log 2>/dev/null || echo "(no Maven sim log captured)"
          echo "==="
          echo "=== Historical system log (last 2 min, forge process) ==="
          xcrun simctl spawn booted log show \
            --predicate 'processImagePath ENDSWITH "forge.ios.Main" OR process == "forge.ios.Main"' \
            --last 2m --style syslog 2>/dev/null | head -200 || echo "(log show not available)"
          echo "==="

          echo "Polling for stable screen (status bar excluded from comparison)..."
          PREV_HASH=""
          STABLE_COUNT=0
          LAST_SHOT=""
          SCREENSHOT_TAKEN=false
          DEAD_COUNT=0

          for k in $(seq 1 40); do
            # Take screenshot with a 30-second timeout to prevent 'xcrun simctl io'
            # from hanging indefinitely if the simulator is in a bad state.
            CUR_SHOT="/tmp/forge-poll-$k.png"
            SCREENSHOT_ERR=$( { timeout 30 xcrun simctl io "$DEVICE_UDID" screenshot "$CUR_SHOT"; } 2>&1 ) || {
              echo "  Poll $k: screenshot failed — $SCREENSHOT_ERR — sleeping 10 s..."
              sleep 10
              continue
            }
            LAST_SHOT="$CUR_SHOT"

            CUR_HASH=$(python3 /tmp/png_hash.py "$CUR_SHOT" 2>/dev/null \
              || md5 -q "$CUR_SHOT")  # fall back to raw file hash if PNG parsing fails

            if [ "$CUR_HASH" = "$PREV_HASH" ] && [ -n "$PREV_HASH" ]; then
              STABLE_COUNT=$((STABLE_COUNT + 1))
              echo "  Poll $k: screen stable ${STABLE_COUNT}/3 (hash prefix: ${CUR_HASH:0:8})"
              if [ "$STABLE_COUNT" -ge 3 ]; then
                echo "Screen has stabilized — loading complete."
                cp "$CUR_SHOT" forge-screenshot.png
                SCREENSHOT_TAKEN=true
                break
              fi
            else
              STABLE_COUNT=0
              echo "  Poll $k: screen changed (hash prefix: ${CUR_HASH:0:8})"
            fi
            PREV_HASH="$CUR_HASH"

            # Check process liveness.  Only track dead count if APP_PID is a
            # valid PID (numeric).  "unknown" must not trigger DEAD_COUNT since
            # kill -0 "unknown" fails with "illegal PID" (not "no such process").
            if [[ "$APP_PID" =~ ^[0-9]+$ ]] && ! kill -0 "$APP_PID" 2>/dev/null; then
              DEAD_COUNT=$((DEAD_COUNT + 1))
              echo "  Poll $k: app process gone (dead count $DEAD_COUNT/3)"
              if [ "$DEAD_COUNT" -ge 3 ]; then
                echo "::warning::App has been dead for 3 consecutive polls — stopping early."
                break
              fi
            else
              DEAD_COUNT=0
            fi

            sleep 15
          done

          # Fallback: use the most recent frame if the screen never stabilized.
          if [ "$SCREENSHOT_TAKEN" != "true" ] && [ -n "$LAST_SHOT" ] && [ -f "$LAST_SHOT" ]; then
            echo "Screen did not stabilize within polling window; using last captured frame."
            cp "$LAST_SHOT" forge-screenshot.png
            SCREENSHOT_TAKEN=true
          fi

          if [ "$SCREENSHOT_TAKEN" != "true" ]; then
            echo "::error::No screenshot could be taken. Simulator may not have booted."
            exit 1
          fi

      - name: Stop simulator
        if: always()
        run: |
          # Use 'log show' (historical, not streaming) to capture any log
          # messages from the app's lifetime that the real-time 'log stream'
          # may have missed due to startup timing.
          xcrun simctl spawn booted log show \
            --predicate 'processImagePath ENDSWITH "forge.ios.Main" OR process == "forge.ios.Main" OR process == "ReportCrash"' \
            --last 5m --style syslog \
            >> /tmp/forge-app-log.txt 2>/dev/null || true

          xcrun simctl shutdown all 2>/dev/null || true

          # Collect crash reports.  iOS Simulator writes them to the per-device
          # CrashReporter directory, NOT to ~/Library/Logs/DiagnosticReports.
          # Search both locations to be safe.
          {
            find ~/Library/Logs/DiagnosticReports \
              -name "*forge*" -newer /tmp/mvn-sim.log \
              -exec cat {} \; 2>/dev/null || true
            find ~/Library/Developer/CoreSimulator/Devices \
              -path "*/Logs/CrashReporter/*forge*" -newer /tmp/mvn-sim.log \
              -exec cat {} \; 2>/dev/null || true
          } > /tmp/forge-crash-reports.txt
          CRASH_LINES=$(wc -l < /tmp/forge-crash-reports.txt 2>/dev/null || echo 0)
          echo "Crash report lines collected: $CRASH_LINES"

          # Print Maven simulator log inline so the error is visible without
          # downloading the artifact.
          echo "=== Maven simulator log (tail 100 lines) ==="
          tail -100 /tmp/mvn-sim.log 2>/dev/null || echo "(none)"
          echo "==="

          # Collect the Forge application log written by ExceptionHandler.
          # It lives inside the app bundle's data/ subdirectory (which is writable
          # in the simulator even though it is read-only on a real device).
          # Use DEVICE_UDID to scope to the current simulator's device directory.
          FORGE_LOG=$(find ~/Library/Developer/CoreSimulator/Devices/"$DEVICE_UDID" \
            -name "forge.log" -newer /tmp/mvn-sim.log 2>/dev/null | head -1 || true)
          if [ -n "$FORGE_LOG" ]; then
            cp "$FORGE_LOG" /tmp/forge-app-data.log 2>/dev/null || true
            echo "=== forge.log ($(wc -l < /tmp/forge-app-data.log) lines) ==="
            cat /tmp/forge-app-data.log
            echo "==="
          else
            echo "forge.log: not found (app may not have run or ExceptionHandler did not fire)"
          fi

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvn-build-log
          path: /tmp/mvn-sim.log
          if-no-files-found: warn

      - name: Upload app and crash logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-logs
          path: |
            /tmp/mvn-sim.log
            /tmp/forge-app-log.txt
            /tmp/forge-crash-reports.txt
            /tmp/forge-app-data.log
          if-no-files-found: warn

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simulator-screenshot
          path: forge-screenshot.png
          if-no-files-found: error
