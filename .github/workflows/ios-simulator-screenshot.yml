name: iOS Simulator Screenshot

on:
  push:
    branches:
      - 'copilot/**'
    paths:
      - 'forge-gui-ios/**'
      - 'forge-gui-mobile/**'
      - 'forge-gui/**'
      - '.github/workflows/ios-simulator-screenshot.yml'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache RoboVM compiler output
        uses: actions/cache@v4
        with:
          path: ~/.robovm/cache
          key: robovm-${{ runner.os }}-${{ hashFiles('forge-gui-ios/pom.xml', 'forge-gui-ios/robovm-simulator.xml', 'forge-gui-ios/robovm.properties', 'forge-gui-ios/native/**', 'forge-gui-ios/src/com/badlogic/gdx/backends/iosrobovm/IOSGLES20.java') }}
          restore-keys: |
            robovm-${{ runner.os }}-

      - name: Compile GL bridge for arm64-simulator
        # Compile native/gl_bridge.m into native/gl_bridge.a with the
        # iphonesimulator SDK targeting arm64-simulator.  This must run BEFORE
        # Maven so that the .a is present when MobiVM links the app binary.
        run: |
          xcrun --sdk iphonesimulator clang \
            -arch arm64 \
            -target arm64-apple-ios-simulator \
            -c forge-gui-ios/native/gl_bridge.m \
            -o forge-gui-ios/native/gl_bridge.o
          xcrun libtool -static forge-gui-ios/native/gl_bridge.o \
            -o forge-gui-ios/native/gl_bridge.a
          rm forge-gui-ios/native/gl_bridge.o
          echo "gl_bridge.a: $(wc -c < forge-gui-ios/native/gl_bridge.a) bytes"

      - name: Build iOS app
        # Run Maven in the foreground so that compilation/AOT progress is visible
        # in the GitHub Actions log.  The ios-simulator profile uses the MobiVM
        # 'install' goal (build-only; no simulator launch), so Maven exits cleanly
        # once the .app bundle is produced.
        run: |
          set -o pipefail
          export _JAVA_OPTIONS="-Xmx4g"
          mvn -B -e clean install -pl forge-gui-ios -am -P ios-simulator \
            -Dmaven.test.skip=true 2>&1 | tee /tmp/mvn-build.log

      - name: Verify GL bridge symbols in binary
        # Confirm that forge_gl* symbols survived the linker's -exported_symbols_list
        # + -dead_strip pass.  If this step reports 0 symbols, the app will crash with
        # UnsatisfiedLinkError for every @Bridge GL method.
        run: |
          BINARY=$(find forge-gui-ios/target/robovm -maxdepth 1 -type f -perm +111 2>/dev/null | head -1)
          if [ -z "$BINARY" ]; then
            echo "::warning::Could not find app binary to inspect"
          else
            echo "Inspecting binary: $BINARY"
            COUNT=$(nm "$BINARY" 2>/dev/null | grep -c "forge_gl" || echo 0)
            echo "forge_gl* symbols in binary: $COUNT"
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::No forge_gl* symbols found in binary — @Bridge methods will fail at runtime"
              exit 1
            fi
            nm "$BINARY" 2>/dev/null | grep "forge_gl" | head -10
          fi

      - name: Boot simulator and launch app
        run: |
          # The MobiVM 'install' goal places the app bundle contents flat in
          # forge-gui-ios/target/robovm/ (binary, Info.plist, res/, lib/, …).
          # xcrun simctl install requires a directory with a .app suffix, so
          # rename target/robovm to target/Forge.app (matching app.name in
          # robovm.properties).
          ROBOVM_OUT="forge-gui-ios/target/robovm"
          APP_PATH="forge-gui-ios/target/Forge.app"
          if [ ! -d "$ROBOVM_OUT" ]; then
            echo "::error::MobiVM output directory not found: $ROBOVM_OUT"
            find forge-gui-ios/target -maxdepth 2 -type d 2>/dev/null || true
            exit 1
          fi
          mv "$ROBOVM_OUT" "$APP_PATH"
          echo "App bundle: $APP_PATH"

          # Pick the newest available iPhone simulator.
          DEVICE_UDID=$(xcrun simctl list devices available --json 2>/dev/null | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          for runtime in sorted(d.keys(), reverse=True):
              if 'iOS' in runtime:
                  for dev in d[runtime]:
                      if dev['isAvailable'] and 'iPhone' in dev['name']:
                          print(dev['udid'])
                          sys.exit(0)
          sys.exit(1)
          " 2>/dev/null || true)
          if [ -z "$DEVICE_UDID" ]; then
            echo "::error::No available iPhone simulator device found"
            xcrun simctl list devices
            exit 1
          fi
          echo "Simulator device: $DEVICE_UDID"

          # Boot and install.
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"

          # Stream the device log before launching so we capture system-level
          # startup messages.  Cap at 20 min (well within the 90-min timeout).
          (log stream --predicate 'processImagePath ENDSWITH "forge.ios.Main" OR process == "forge.ios.Main"' \
            >> /tmp/forge-app-log.txt 2>&1 &
           LOG_BG=$!
           sleep 1200 && kill $LOG_BG 2>/dev/null) &
          SIM_LOG_PID=$!
          sleep 1  # give the log stream time to start

          # --console-pty pipes the app's stdout+stderr (including JVM exception
          # stack traces) to forge-console.log.  Run in background so the
          # screenshot loop can proceed.  The first line of output is the PID
          # announcement "forge.ios: <pid>"; subsequent lines are the app's output.
          xcrun simctl launch --console-pty "$DEVICE_UDID" forge.ios \
            > /tmp/forge-console.log 2>&1 &
          CONSOLE_PID=$!
          sleep 2  # give simctl time to write the PID line

          # Parse the app PID from the first line of the console log.
          APP_PID=$(head -1 /tmp/forge-console.log 2>/dev/null \
            | grep -oE 'forge\.ios: ([0-9]+)' | grep -oE '[0-9]+' || true)
          echo "App PID: ${APP_PID:-not available}"

          echo "DEVICE_UDID=$DEVICE_UDID"   >> "$GITHUB_ENV"
          echo "APP_PID=$APP_PID"           >> "$GITHUB_ENV"
          echo "SIM_LOG_PID=$SIM_LOG_PID"   >> "$GITHUB_ENV"
          echo "CONSOLE_PID=$CONSOLE_PID"   >> "$GITHUB_ENV"

      - name: Wait for app to load and capture screenshot
        run: |
          # Write a helper that hashes PNG image data while skipping the top 5 %
          # of rows (the iOS status bar that shows the system clock).  Comparing
          # cropped hashes rather than raw bytes prevents the minute-hand tick from
          # resetting the stability counter between 20-second polling intervals.
          cat > /tmp/png_hash.py << 'PYEOF'
          import sys, zlib, struct, hashlib
          path = sys.argv[1]
          with open(path, 'rb') as f:
              data = f.read()
          pos = 8
          width = height = color_type = bit_depth = 0
          idat = b''
          while pos < len(data):
              length = struct.unpack('>I', data[pos:pos+4])[0]
              ctype  = data[pos+4:pos+8]
              chunk  = data[pos+8:pos+8+length]
              pos   += 12 + length
              if ctype == b'IHDR':
                  width      = struct.unpack('>I', chunk[:4])[0]
                  height     = struct.unpack('>I', chunk[4:8])[0]
                  bit_depth  = chunk[8]
                  color_type = chunk[9]
              elif ctype == b'IDAT':
                  idat += chunk
              elif ctype == b'IEND':
                  break
          channels   = {0:1, 2:3, 3:1, 4:2, 6:4}.get(color_type, 4)
          row_bytes  = 1 + width * channels * max(1, bit_depth // 8)
          skip_rows  = max(50, height // 20)   # ≥50 px, or 5 % of image height (whichever is larger)
          raw        = zlib.decompress(idat)
          print(hashlib.md5(raw[skip_rows * row_bytes:]).hexdigest())
          PYEOF

          echo "Waiting for Forge app process to start..."
          for j in $(seq 1 20); do
            sleep 15
            # Check by PID (from simctl launch output) and by process name.
            if { [ -n "$APP_PID" ] && kill -0 "$APP_PID" 2>/dev/null; } \
               || pgrep -f "forge.ios.Main" > /dev/null 2>&1; then
              echo "Forge app process is running."
              break
            fi
            echo "  Check $j/20: app not yet running..."
          done

          # Print the first lines of both captured logs — the console log
          # shows JVM exception stack traces; the system log shows OS-level events.
          echo "=== App console log (stdout/stderr, first 100 lines) ==="
          head -100 /tmp/forge-console.log 2>/dev/null || echo "(no console log captured)"
          echo "==="
          echo "=== System log (first 100 lines) ==="
          head -100 /tmp/forge-app-log.txt 2>/dev/null || echo "(no system log captured)"
          echo "==="

          echo "Polling for stable screen (status bar excluded from comparison)..."
          PREV_HASH=""
          STABLE_COUNT=0
          LAST_SHOT=""
          SCREENSHOT_TAKEN=false

          for k in $(seq 1 40); do
            CUR_SHOT="/tmp/forge-poll-$k.png"
            xcrun simctl io "$DEVICE_UDID" screenshot "$CUR_SHOT" 2>/dev/null \
              || { sleep 15; continue; }
            LAST_SHOT="$CUR_SHOT"

            CUR_HASH=$(python3 /tmp/png_hash.py "$CUR_SHOT" 2>/dev/null \
              || md5 -q "$CUR_SHOT")  # fall back to raw file hash if PNG parsing fails

            if [ "$CUR_HASH" = "$PREV_HASH" ] && [ -n "$PREV_HASH" ]; then
              STABLE_COUNT=$((STABLE_COUNT + 1))
              echo "  Screen stable ${STABLE_COUNT}/3 (hash prefix: ${CUR_HASH:0:8})"
              if [ "$STABLE_COUNT" -ge 3 ]; then
                echo "Screen has stabilized — loading complete."
                cp "$CUR_SHOT" forge-screenshot.png
                SCREENSHOT_TAKEN=true
                break
              fi
            else
              STABLE_COUNT=0
              echo "  Screen changed (hash prefix: ${CUR_HASH:0:8})"
            fi
            PREV_HASH="$CUR_HASH"
            sleep 15
          done

          # Fallback: use the most recent frame if the screen never stabilized.
          if [ "$SCREENSHOT_TAKEN" != "true" ] && [ -n "$LAST_SHOT" ] && [ -f "$LAST_SHOT" ]; then
            echo "Screen did not stabilize within polling window; using last captured frame."
            cp "$LAST_SHOT" forge-screenshot.png
            SCREENSHOT_TAKEN=true
          fi

          if [ "$SCREENSHOT_TAKEN" != "true" ]; then
            echo "::error::No screenshot could be taken. Simulator may not have booted."
            exit 1
          fi

      - name: Stop simulator
        if: always()
        run: |
          # Stop the background log stream and console capture.
          [ -n "$SIM_LOG_PID" ]  && kill "$SIM_LOG_PID"  2>/dev/null || true
          [ -n "$CONSOLE_PID" ]  && kill "$CONSOLE_PID"  2>/dev/null || true
          xcrun simctl shutdown all 2>/dev/null || true
          # Collect crash reports produced since the workflow started.
          # Use a reference file created at job start as the -newer anchor.
          find ~/Library/Logs/DiagnosticReports -name "*forge*" \
            -newer /tmp/mvn-build.log \
            -exec cat {} \; 2>/dev/null > /tmp/forge-crash-reports.txt || true
          CRASH_LINES=$(wc -l < /tmp/forge-crash-reports.txt 2>/dev/null || echo 0)
          echo "Crash report lines collected: $CRASH_LINES"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvn-build-log
          path: /tmp/mvn-build.log
          if-no-files-found: warn

      - name: Upload app and crash logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-logs
          path: |
            /tmp/forge-console.log
            /tmp/forge-app-log.txt
            /tmp/forge-crash-reports.txt
          if-no-files-found: warn

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simulator-screenshot
          path: forge-screenshot.png
          if-no-files-found: error
