name: iOS Simulator Screenshot

on:
  push:
    branches:
      - 'copilot/spec-out-forge-ios-support'
    paths:
      - 'forge-gui-ios/**'
      - 'forge-gui-mobile/**'
      - '.github/workflows/ios-simulator-screenshot.yml'
  workflow_dispatch:
    inputs:
      debug:
        description: >
          Build with LLVM debug info for symbolication (-Drobovm.debug=true).
          Emits DWARF into the binary, runs dsymutil to produce a .app.dSYM bundle,
          and uploads it as an artifact. Useful for symbolicating crash addresses with
          `atos` or Instruments Allocations.  Also enables a JDWP listener on port 5005
          (fine for profiling; do not distribute this build).
        required: false
        default: 'false'
        type: boolean

jobs:
  screenshot:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install robovmx (robovm-rt with Java 8 APIs)
        run: bash scripts/install-robovmx.sh

      - name: Build java.lang.Record stub for robovmx
        run: bash scripts/build-java-stubs.sh

      - name: Build all modules and start iOS Simulator app in background
        run: |
          export _JAVA_OPTIONS="-Xmx4g"
          # -am builds all upstream modules first, then forge-gui-ios with the ios-simulator profile.
          # Keeping both in one Maven reactor avoids the ${revision} resolution issue that occurs
          # when running a second mvn invocation against an already-installed (flattened) parent POM.
          # iphone-sim boots the simulator, installs and launches the app, then blocks —
          # run in background so the next step can poll for the booted state.
          #
          # Debug/symbolication mode (workflow_dispatch input debug=true):
          #   -Drobovm.debug=true    → LLVM -g emits DWARF into every compiled method
          #   debugPort=5005 (from pom.xml <robovm.debugPort>) → JDWP port, required when debug=true
          #   generateDsym=true (auto, mirrors debug) → dsymutil runs → .app.dSYM
          # The resulting dSYM is uploaded below and can be used with atos:
          #   atos -arch arm64 -o Forge.app.dSYM/Contents/Resources/DWARF/Forge \
          #        -l <load-address> <crash-address>
          DEBUG_FLAGS=""
          if [ "${{ inputs.debug }}" = "true" ]; then
            # -Drobovm.debugPort is already set to 5005 via pom.xml <robovm.debugPort>
            DEBUG_FLAGS="-Drobovm.debug=true"
          fi
          mvn -U -B clean install -pl forge-gui-ios -am -P ios-simulator \
            -Dmaven.test.skip=true \
            ${DEBUG_FLAGS} &
          echo "MVN_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for simulator to boot and app to launch, then screenshot
        run: |
          echo "Waiting for MobiVM AOT compilation and simulator launch..."
          echo "(robovmx compiles Java to native code on first run — this can take 30–45 min)"
          SCREENSHOT_TAKEN=false
          for i in $(seq 1 60); do
            sleep 60
            echo "Minute $i/60: checking for a booted simulator..."
            # Exit early if Maven has already finished (success or failure).
            if ! kill -0 "${MVN_PID}" 2>/dev/null; then
              echo "Maven process has exited."
              break
            fi
            BOOTED=$(xcrun simctl list devices booted 2>/dev/null | grep -c "Booted" || true)
            if [ "${BOOTED:-0}" -gt "0" ]; then
              echo "Simulator booted. Waiting 90 s for the app to start rendering..."
              sleep 90
              xcrun simctl io booted screenshot forge-screenshot.png
              echo "Screenshot saved."
              SCREENSHOT_TAKEN=true
              break
            fi
          done
          # If Maven exited but the simulator was already booted, try to screenshot now.
          if [ "$SCREENSHOT_TAKEN" != "true" ]; then
            BOOTED=$(xcrun simctl list devices booted 2>/dev/null | grep -c "Booted" || true)
            if [ "${BOOTED:-0}" -gt "0" ]; then
              echo "Simulator is booted (Maven just exited). Taking screenshot..."
              xcrun simctl io booted screenshot forge-screenshot.png && SCREENSHOT_TAKEN=true
            fi
          fi
          if [ "$SCREENSHOT_TAKEN" != "true" ]; then
            echo "::warning::Simulator did not boot. Capturing the desktop as a fallback."
            screencapture -x forge-screenshot.png || true
          fi

      - name: Stop simulator and clean up
        if: always()
        run: |
          [ -n "${MVN_PID}" ] && kill "${MVN_PID}" 2>/dev/null || true
          xcrun simctl shutdown all 2>/dev/null || true

      - name: Locate and stage dSYM bundle
        if: always()
        run: |
          # RoboVM writes the dSYM alongside the .app in target/robovm/ when generateDsym=true
          # (i.e. when built with -Drobovm.debug=true).  Without debug mode no dSYM is produced.
          DSYM_COUNT=$(find forge-gui-ios/target -name "*.app.dSYM" -type d 2>/dev/null | wc -l)
          if [ "${DSYM_COUNT}" -gt 1 ]; then
            echo "::warning::Multiple .app.dSYM bundles found (${DSYM_COUNT}); using the first one."
            find forge-gui-ios/target -name "*.app.dSYM" -type d 2>/dev/null
          fi
          DSYM=$(find forge-gui-ios/target -name "*.app.dSYM" -type d 2>/dev/null | head -1)
          if [ -n "$DSYM" ]; then
            echo "dSYM found: $DSYM"
            # Zip so it uploads as a single artifact file.
            (cd "$(dirname "$DSYM")" && zip -r "$GITHUB_WORKSPACE/forge-ios-simulator.app.dSYM.zip" "$(basename "$DSYM")")
            echo "dSYM staged: forge-ios-simulator.app.dSYM.zip"
            echo "To symbolicate an address from a simulator crash report or Instruments:"
            echo "  unzip forge-ios-simulator.app.dSYM.zip"
            echo "  atos -arch arm64 -o Forge.app.dSYM/Contents/Resources/DWARF/Forge \\"
            echo "       -l <load-address> <crash-address>"
            echo "(app binary name 'Forge' comes from app.name in forge-gui-ios/robovm.properties)"
          else
            echo "No .app.dSYM found (expected: build was run without -Drobovm.debug=true)."
          fi

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: forge-screenshot.png
          if-no-files-found: warn

      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-ios-simulator-dsym
          path: forge-ios-simulator.app.dSYM.zip
          if-no-files-found: warn
